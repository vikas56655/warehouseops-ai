name: CI
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warehouseops
          POSTGRES_PASSWORD: localtest
          POSTGRES_DB: warehouseops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warehouseops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://warehouseops:localtest@localhost:5432/warehouseops
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: python -m pytest -q
      - run: alembic upgrade head
      - run: python -m app.import_events data/demo_events.csv
      - name: PostgreSQL and API smoke test
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          client = TestClient(app)
          assert client.get('/health/ready').status_code == 200
          response = client.get('/api/v1/operations/summary')
          assert response.status_code == 200
          zones = response.json()['zones']
          assert sum(z['units'] for z in zones) == 132
          assert sum(z['colis'] for z in zones) == 16
          for season in ('summer', 'winter'):
              response = client.get('/api/v1/simulation/run', params={'season': season})
              assert response.status_code == 200
              data = response.json()
              assert data['arrived'] == data['completed'] + data['backlog']
              assert data['provenance'] == 'synthetic_demo'
          print('PostgreSQL and simulation API smoke checks passed')
          PY
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
